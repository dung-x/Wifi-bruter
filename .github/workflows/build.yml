name: Build iOS Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        variant: [rootful, rootless, roothide]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Install dpkg (required by Theos for deb packaging)
        run: |
          brew install dpkg
          if ! command -v dm.pl &> /dev/null; then
            echo '#!/usr/bin/env perl' > /opt/homebrew/bin/dm.pl
            echo 'exit 0;' >> /opt/homebrew/bin/dm.pl
            chmod +x /opt/homebrew/bin/dm.pl
          fi

      - name: Set up Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Update Theos vendor directories
        run: $THEOS/bin/update-theos

      - name: Select control file for variant
        run: |
          cp control.${{ matrix.variant }} control

      - name: Set install prefix for variant
        run: |
          if [ "${{ matrix.variant }}" = "rootful" ]; then
            echo "PREFIX=" >> $GITHUB_ENV
          else
            echo "PREFIX=/var/jb" >> $GITHUB_ENV
          fi

      - name: Build package
        run: |
          if [ -n "$PREFIX" ]; then
            THEOS_PACKAGE_INSTALL_PREFIX=$PREFIX make package
          else
            make package
          fi

      - name: Fix deb architecture for Sileo compatibility
        run: |
          DEB=$(find . -name "*.deb" | head -1)
          DEBNAME=$(basename "$DEB")
          mkdir -p deb-extract
          dpkg-deb -R "$DEB" deb-extract
          sed -i '' "s/Architecture: iphoneos-arm64/Architecture: iphoneos-arm64/" deb-extract/DEBIAN/control
          sed -i '' 's/+debug//' deb-extract/DEBIAN/control
          dpkg-deb -b deb-extract "$DEBNAME"
          rm -rf deb-extract

      - name: Rename deb for variant
        run: |
          DEB=$(find . -name "*.deb" | head -1)
          DEBNAME=$(basename "$DEB")
          VERSION=$(grep "^Version:" control | awk '{print $2}')
          if [ "${{ matrix.variant }}" = "rootful" ]; then
            mv "$DEB" "dungx.wifibruter_${VERSION}_iphoneos-arm64.deb"
          elif [ "${{ matrix.variant }}" = "rootless" ]; then
            mv "$DEB" "dungx.wifibruter-rootless_${VERSION}_iphoneos-arm64.deb"
          else
            mv "$DEB" "dungx.wifibruter-roothide_${VERSION}_iphoneos-arm64.deb"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifibruter-deb-${{ matrix.variant }}
          path: '*.deb'
