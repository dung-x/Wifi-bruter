name: Build iOS Tweak (Rootful, Rootless, Roothide)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        variant: [rootful, rootless, roothide]
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Install dpkg (required by Theos for deb packaging)
        run: |
          brew install dpkg
          if ! command -v dm.pl &> /dev/null; then
            echo '#!/usr/bin/env perl' > /opt/homebrew/bin/dm.pl
            echo 'exit 0;' >> /opt/homebrew/bin/dm.pl
            chmod +x /opt/homebrew/bin/dm.pl
          fi

      - name: Set up Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Update Theos vendor directories
        run: $THEOS/bin/update-theos

      - name: Select control file for variant
        run: |
          if [ "${{ matrix.variant }}" = "rootless" ]; then
            cp control.rootless control.tmp
          elif [ "${{ matrix.variant }}" = "roothide" ]; then
            cp control.roothide control.tmp
          else
            cp control control.tmp
          fi
          mv control.tmp control

      - name: Build package
        run: |
          if [ "${{ matrix.variant }}" = "rootful" ]; then
            make package
          else
            THEOS_PACKAGE_INSTALL_PREFIX=/var/jb make package
          fi

      - name: Rename deb for variant
        run: |
          DEB=$(find . -name "*.deb" | head -1)
          if [ "${{ matrix.variant }}" = "rootful" ]; then
            mv "$DEB" "dungx.wifibruter_1.0-1_iphoneos-arm64.deb"
          elif [ "${{ matrix.variant }}" = "rootless" ]; then
            mv "$DEB" "dungx.wifibruter-rootless_1.0-1_iphoneos-arm64.deb"
          else
            mv "$DEB" "dungx.wifibruter-roothide_1.0-1_iphoneos-arm64.deb"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifibruter-deb-${{ matrix.variant }}
          path: '*.deb'
