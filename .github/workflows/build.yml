name: Build iOS Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Install dpkg (required by Theos for deb packaging)
        run: |
          brew install dpkg
          if ! command -v dm.pl &> /dev/null; then
            echo '#!/usr/bin/env perl' > /opt/homebrew/bin/dm.pl
            echo 'exit 0;' >> /opt/homebrew/bin/dm.pl
            chmod +x /opt/homebrew/bin/dm.pl
          fi

      - name: Set up Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Update Theos vendor directories
        run: $THEOS/bin/update-theos

      - name: Build package
        run: THEOS_BUILD_TYPE=release make package

      - name: Fix deb architecture and version for Sileo compatibility
        run: |
          DEB=$(find . -name "*.deb" | head -1)
          DEBNAME=$(basename "$DEB")
          mkdir -p deb-extract
          dpkg-deb -R "$DEB" deb-extract
          sed -i '' 's/Architecture: iphoneos-arm64/Architecture: iphoneos-arm/' deb-extract/DEBIAN/control
          sed -i '' 's/+debug//' deb-extract/DEBIAN/control
          dpkg-deb -b deb-extract "$DEBNAME"
          rm -rf deb-extract

      - name: Get version from control
        id: version
        run: |
          VERSION=$(dpkg-deb -f "$(find . -name '*.deb' | head -1)" Version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WiFiBruter v${{ steps.version.outputs.version }}
          body: |
            WiFiBruter v${{ steps.version.outputs.version }}
            
            Changes:
            - Built for iOS 12 and iOS 15 compatibility
            - Architecture: iphoneos-arm (Sileo compatible)
            - Settings app preference bundle
            
            Install: Add https://dung-x.github.io/dungxrepo/ to Sileo
          draft: false
          prerelease: false
          files: |
            *.deb
